<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 26" width="100" height="26">
  <!-- Simple toran: one swag per 100px tile with mango leaves and flower petals.
       The string meets the next tile at y=4, so the pattern repeats seamlessly. -->
  <path d="M0 4 Q50 24 100 4" fill="none" stroke="#7A5A2E" stroke-width="1.1"/>
  <g fill="#2E8B3E">
    <ellipse cx="12.5" cy="8.4" rx="4" ry="1.8" transform="rotate(-30 12.5 8.4)"/>
    <ellipse cx="37.5" cy="13.4" rx="4" ry="1.8" transform="rotate(20 37.5 13.4)"/>
    <ellipse cx="62.5" cy="13.4" rx="4" ry="1.8" transform="rotate(-20 62.5 13.4)"/>
    <ellipse cx="87.5" cy="8.4" rx="4" ry="1.8" transform="rotate(30 87.5 8.4)"/>
  </g>
  <g transform="translate(25 11.5)" fill="#F472B6">
    <ellipse cx="0" cy="-2.3" rx="1.5" ry="2.4"/>
    <ellipse cx="0" cy="-2.3" rx="1.5" ry="2.4" transform="rotate(72)"/>
    <ellipse cx="0" cy="-2.3" rx="1.5" ry="2.4" transform="rotate(144)"/>
    <ellipse cx="0" cy="-2.3" rx="1.5" ry="2.4" transform="rotate(216)"/>
    <ellipse cx="0" cy="-2.3" rx="1.5" ry="2.4" transform="rotate(288)"/>
    <circle r="1" fill="#FDE68A"/>
  </g>
  <g transform="translate(75 11.5)" fill="#F472B6">
    <ellipse cx="0" cy="-2.3" rx="1.5" ry="2.4"/>
    <ellipse cx="0" cy="-2.3" rx="1.5" ry="2.4" transform="rotate(72)"/>
    <ellipse cx="0" cy="-2.3" rx="1.5" ry="2.4" transform="rotate(144)"/>
    <ellipse cx="0" cy="-2.3" rx="1.5" ry="2.4" transform="rotate(216)"/>
    <ellipse cx="0" cy="-2.3" rx="1.5" ry="2.4" transform="rotate(288)"/>
    <circle r="1" fill="#FDE68A"/>
  </g>
  <g transform="translate(50 14)" fill="#F97316">
    <ellipse cx="0" cy="-2.8" rx="1.8" ry="2.8"/>
    <ellipse cx="0" cy="-2.8" rx="1.8" ry="2.8" transform="rotate(72)"/>
    <ellipse cx="0" cy="-2.8" rx="1.8" ry="2.8" transform="rotate(144)"/>
    <ellipse cx="0" cy="-2.8" rx="1.8" ry="2.8" transform="rotate(216)"/>
    <ellipse cx="0" cy="-2.8" rx="1.8" ry="2.8" transform="rotate(288)"/>
    <circle r="1.1" fill="#FDE68A"/>
  </g>
</svg>
