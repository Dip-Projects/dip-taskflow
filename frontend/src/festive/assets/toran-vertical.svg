<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 120" width="30" height="120">
  <!-- The horizontal toran turned 90 degrees, for hanging down a sidebar edge. -->
  <style>
    .bulb { animation: festive-bulb 1.6s ease-in-out infinite; }
    .glow { animation: festive-bulb 1.6s ease-in-out infinite; }
    .d0 { animation-delay: 0s; }
    .d1 { animation-delay: 0.4s; }
    .d2 { animation-delay: 0.8s; }
    .d3 { animation-delay: 1.2s; }
    @keyframes festive-bulb {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
  </style>
  <g transform="translate(30 0) rotate(90)">
    <path d="M0 4 Q60 26 120 4" fill="none" stroke="#7A5A2E" stroke-width="1.2"/>
    <g fill="#2E8B3E">
      <ellipse cx="15" cy="8" rx="4.2" ry="1.9" transform="rotate(-30 15 8)"/>
      <ellipse cx="45" cy="14.3" rx="4.2" ry="1.9" transform="rotate(20 45 14.3)"/>
      <ellipse cx="75" cy="14.3" rx="4.2" ry="1.9" transform="rotate(-20 75 14.3)"/>
      <ellipse cx="105" cy="8" rx="4.2" ry="1.9" transform="rotate(30 105 8)"/>
    </g>
    <g>
      <circle cx="30" cy="12.3" r="3.4" fill="#F59E0B"/>
      <circle cx="30" cy="12.3" r="1.4" fill="#FCD34D"/>
      <circle cx="60" cy="15" r="3.6" fill="#F97316"/>
      <circle cx="60" cy="15" r="1.5" fill="#FDE68A"/>
      <circle cx="90" cy="12.3" r="3.4" fill="#F59E0B"/>
      <circle cx="90" cy="12.3" r="1.4" fill="#FCD34D"/>
    </g>
    <g class="glow d0" fill="#EF4444" opacity="0.35"><circle cx="7.5" cy="9.1" r="3.8"/></g>
    <circle class="bulb d0" cx="7.5" cy="9.1" r="2.1" fill="#EF4444"/>
    <g class="glow d1" fill="#FACC15" opacity="0.35"><circle cx="22.5" cy="13.2" r="3.8"/></g>
    <circle class="bulb d1" cx="22.5" cy="13.2" r="2.1" fill="#FACC15"/>
    <g class="glow d2" fill="#3B82F6" opacity="0.35"><circle cx="37.5" cy="16" r="3.8"/></g>
    <circle class="bulb d2" cx="37.5" cy="16" r="2.1" fill="#3B82F6"/>
    <g class="glow d3" fill="#22C55E" opacity="0.35"><circle cx="52.5" cy="17.3" r="3.8"/></g>
    <circle class="bulb d3" cx="52.5" cy="17.3" r="2.1" fill="#22C55E"/>
    <g class="glow d1" fill="#FACC15" opacity="0.35"><circle cx="67.5" cy="17.3" r="3.8"/></g>
    <circle class="bulb d1" cx="67.5" cy="17.3" r="2.1" fill="#FACC15"/>
    <g class="glow d2" fill="#EF4444" opacity="0.35"><circle cx="82.5" cy="16" r="3.8"/></g>
    <circle class="bulb d2" cx="82.5" cy="16" r="2.1" fill="#EF4444"/>
    <g class="glow d3" fill="#3B82F6" opacity="0.35"><circle cx="97.5" cy="13.2" r="3.8"/></g>
    <circle class="bulb d3" cx="97.5" cy="13.2" r="2.1" fill="#3B82F6"/>
    <g class="glow d0" fill="#22C55E" opacity="0.35"><circle cx="112.5" cy="9.1" r="3.8"/></g>
    <circle class="bulb d0" cx="112.5" cy="9.1" r="2.1" fill="#22C55E"/>
  </g>
</svg>
